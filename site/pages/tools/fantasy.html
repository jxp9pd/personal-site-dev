{{header}}
  <main class="page note-page fantasy-page">
    <div class="page-header reveal d1">
      <a class="back-link" href="/tools/vestaboard/"><svg class="back-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg> Vestaboard</a>
      <h1>Fantasy <em>football</em></h1>
    </div>
    <section class="preview-section reveal d2" aria-labelledby="preview-title">
      <div class="preview-meta">
        <h2 id="preview-title">Scores</h2>
        <span id="week" class="week"></span>
        <span id="tracking-status" class="status status-dot tracking-status" role="status">Ready</span>
      </div>
      <div class="board-frame"><div id="board" class="board" role="img" aria-label="Fantasy football board preview"></div></div>
      <div id="matchups" class="matchups"></div>
      <p id="alert-status" class="status alert-status" role="status"></p>
      <p id="delivery" class="status delivery" role="status"></p>
      <p id="source-status" class="status source-status" role="status"></p>
      <p id="updated" class="status updated"></p>
    </section>
    <form id="league-form" class="composer reveal d3" aria-labelledby="league-title">
      <div class="field-heading"><h2 id="league-title">Your leagues</h2></div>
      <fieldset id="league-fields" class="league-fields">
        <div class="league-settings">
          <label class="field-label" for="league-1">League 1 URL<input id="league-1" class="input" type="url" maxlength="300" value="https://sleeper.com/leagues/1399168246661296128" autocomplete="off" required /></label>
          <div class="league-details">
            <label class="field-label" for="username-1">Username<input id="username-1" class="input" type="text" maxlength="40" value="pentakalos" autocapitalize="none" spellcheck="false" autocomplete="off" pattern="[A-Za-z0-9_.\-]+" required /></label>
            <label class="field-label" for="label-1">Board label<input id="label-1" class="input label-input" type="text" maxlength="3" value="TD" pattern="[A-Za-z0-9]{1,3}" autocomplete="off" required /></label>
          </div>
        </div>
        <div class="league-settings">
          <label class="field-label" for="league-2">League 2 URL<input id="league-2" class="input" type="url" maxlength="300" value="https://sleeper.com/leagues/1389707496347697152" autocomplete="off" required /></label>
          <div class="league-details">
            <label class="field-label" for="username-2">Username<input id="username-2" class="input" type="text" maxlength="40" value="pentakalos" autocapitalize="none" spellcheck="false" autocomplete="off" pattern="[A-Za-z0-9_.\-]+" required /></label>
            <label class="field-label" for="label-2">Board label<input id="label-2" class="input label-input" type="text" maxlength="3" value="SH" pattern="[A-Za-z0-9]{1,3}" autocomplete="off" required /></label>
          </div>
        </div>
      </fieldset>
      <div class="fantasy-actions">
        <button id="preview" class="button" type="button" disabled>Preview matchups</button>
        <button id="start" class="button button-primary button-lg send-button" type="submit" disabled>Start tracking <span aria-hidden="true">↗</span></button>
        <button id="stop" class="button" type="button" hidden>Stop tracking</button>
      </div>
      <p id="feedback" class="status feedback" role="status"></p>
      <button id="reconnect" type="button" class="button reconnect-button" hidden>Retry connection</button>
    </form>
    <noscript><p>Enable JavaScript to preview your leagues and start tracking.</p></noscript>
  </main>
