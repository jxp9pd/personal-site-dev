{{header}}

  <main>
    <div class="page-heading">
      <h1>Vestaboard<span class="title-dot">.</span></h1>
      <div class="tile-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <ul class="app-list" aria-label="Vestaboard apps">
      <li class="note-app">
        <a class="app-card" href="/tools/vestaboard.html" aria-labelledby="note-title">
          <div class="app-art" aria-hidden="true">
            <span class="app-number"></span>
            <div class="mini-note">
              <div class="app-board" data-preview="HEY, YOU.&#10;HAVE A GOOD DAY&#10;🟨🟨🟨"></div>
              <span class="device-name">Vestaboard</span>
            </div>
          </div>
          <div class="app-info">
            <h2 id="note-title">Send a note</h2>
            <span class="app-arrow" aria-hidden="true">&nearr;</span>
          </div>
        </a>
      </li>
      <li class="timer-app">
        <a class="app-card" href="/tools/pomodoro.html" aria-labelledby="timer-title">
          <div class="app-art" aria-hidden="true">
            <span class="app-number"></span>
            <div class="mini-note">
              <div class="app-board" data-preview="ONE THING&#10;FOCUS 25 MIN&#10;🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪"></div>
              <span class="device-name">Vestaboard</span>
            </div>
          </div>
          <div class="app-info">
            <h2 id="timer-title">Pomodoro timer</h2>
            <span class="app-arrow" aria-hidden="true">&nearr;</span>
          </div>
        </a>
      </li>
      <li class="nfl-app">
        <a class="app-card" href="/tools/nfl.html" aria-labelledby="nfl-title">
          <div class="app-art" aria-hidden="true">
            <span class="app-number"></span>
            <div class="mini-note">
              <div class="app-board" data-grid data-preview="🟥 SF 🟨  🟦 SEA 🟩&#10;  21       17&#10;   🟧"></div>
              <span class="device-name">Vestaboard</span>
            </div>
          </div>
          <div class="app-info">
            <h2 id="nfl-title">NFL scores</h2>
            <span class="app-arrow" aria-hidden="true">&nearr;</span>
          </div>
        </a>
      </li>
      <li class="fantasy-app">
        <a class="app-card" href="/tools/fantasy.html" aria-labelledby="fantasy-title">
          <div class="app-art" aria-hidden="true">
            <span class="app-number"></span>
            <div class="mini-note">
              <div class="app-board" data-preview="TD 123 - 119&#10;SH  99 - 101"></div>
              <span class="device-name">Vestaboard</span>
            </div>
          </div>
          <div class="app-info">
            <h2 id="fantasy-title">Fantasy football</h2>
            <span class="app-arrow" aria-hidden="true">&nearr;</span>
          </div>
        </a>
      </li>
    </ul>
  </main>
