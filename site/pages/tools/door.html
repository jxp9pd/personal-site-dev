{{header}}
  <main class="page door-page">
    <div class="page-header">
      <a class="back-link" href="/tools/"><svg class="back-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg> Tools</a>
      <h1>Door</h1>
    </div>

    <div class="door-grid">
    <section class="door-panel door-lock" aria-label="Lock">
      <div id="lock-state" class="lock-state" data-state="unknown" role="status">
        <svg class="lock-icon" viewBox="0 0 64 80" aria-hidden="true">
          <path class="lock-shackle" d="M18 38V24a14 14 0 0 1 28 0v14" />
          <rect class="lock-body" x="6" y="36" width="52" height="40" rx="9" />
          <path class="lock-keyhole" d="M32 50v10" />
        </svg>
        <span id="lock-state-text" class="lock-state-text">Checking…</span>
      </div>
      <div class="door-actions">
        <button type="button" id="lock" class="button button-lg" disabled>Lock</button>
        <button type="button" id="unlock" class="button button-lg" disabled>Unlock</button>
      </div>
      <p id="lock-feedback" class="status" role="status" aria-live="polite"></p>
      <button type="button" id="login" class="button button-primary" hidden>Log in</button>
    </section>

    <div id="owner" hidden>
      <form id="code-form" class="door-panel" aria-labelledby="code-title">
        <h2 id="code-title">New keypad code</h2>
        <div class="code-fields">
          <label class="code-field code-field-wide"><span class="field-label">Name</span>
            <input id="code-label" class="input" name="label" maxlength="60" required autocomplete="off"></label>
          <fieldset class="code-field code-when"><legend class="field-label">From (PT)</legend>
            <div class="code-when-inputs">
              <input id="code-start-date" class="input" type="date" required aria-label="From date">
              <input id="code-start-time" class="input" type="time" required aria-label="From time">
            </div>
          </fieldset>
          <fieldset class="code-field code-when"><legend class="field-label">Until (PT)</legend>
            <div class="code-when-inputs">
              <input id="code-end-date" class="input" type="date" required aria-label="Until date">
              <input id="code-end-time" class="input" type="time" required aria-label="Until time">
            </div>
          </fieldset>
        </div>
        <button type="submit" id="create-code" class="button button-primary">Create code</button>
        <p id="code-feedback" class="status" role="status" aria-live="polite"></p>
        <div id="new-code" class="new-code" hidden>
          <textarea id="new-code-message" class="input" rows="2" readonly aria-label="Message for your guest"></textarea>
          <div class="new-code-row">
            <button type="button" id="copy-code" class="button">Copy</button>
          </div>
        </div>
      </form>

      <section class="door-panel" aria-labelledby="codes-title">
        <h2 id="codes-title">Codes</h2>
        <ul id="codes" class="door-list"></ul>
        <p id="codes-empty" class="status">No active codes.</p>
      </section>

      <details class="door-panel door-more">
        <summary>Activity</summary>
        <ul id="events" class="door-list"></ul>
        <p id="events-empty" class="status">No activity yet.</p>
      </details>
    </div>
    </div>
    <noscript><p>Enable JavaScript to use the door.</p></noscript>
  </main>
