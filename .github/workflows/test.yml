name: Test

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify generated site files
        run: npm run check:site
      - name: Run tests
        run: npm test
      - name: Lint Python
        run: |
          python3 -m pip install --quiet pyflakes==3.2.0
          python3 -m pyflakes services/vestaboard scripts/*.py
      - name: Test Vestaboard gateway
        run: python3 -m unittest discover -s services/vestaboard -p 'test_*.py'
