<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Send a little note from the internet to John's Vestaboard Note." />
  <title>Leave a note — Penta Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/site.css?v=3" />
  <link rel="stylesheet" href="/assets/css/vestaboard.css?v=4" />
  <script type="module" src="/assets/js/vestaboard.js?v=4"></script>
</head>
<body>
  <header class="site-head">
    <a class="logo gradient-text" href="/">Penta Projects</a>
    <nav class="nav" aria-label="Main navigation">
      <a class="btn" href="/games">Games</a>
      <a class="btn" href="/tools" aria-current="page">Tools</a>
    </nav>
  </header>
  <main class="note-page">
    <div class="note-heading reveal d1">
      <h1>Leave a <em>note</em></h1>
    </div>

    <section class="preview-section reveal d2" aria-labelledby="preview-title">
      <div class="preview-meta">
        <h2 id="preview-title">Preview</h2>
      </div>
      <div class="board-frame">
        <div id="board" class="board" role="img" aria-label="Message preview"></div>
      </div>
    </section>

    <form id="message-form" class="composer reveal d3">
      <div class="field-heading">
        <label for="message">Your message</label>
        <button type="button" id="clear" class="text-button">Clear</button>
      </div>
      <textarea id="message" name="message" rows="3" maxlength="240" spellcheck="false" aria-describedby="validation" placeholder="Write a little note…">🟦🟧 WAHOOWA 🟧🟦</textarea>
      <p id="validation" class="validation" aria-live="polite"></p>
      <div class="composer-actions">
        <div class="palette" role="group" aria-label="Add a heart or color tile">
          <button type="button" class="heart-button" data-symbol="♥" aria-label="Add a heart">♥</button>
          <button type="button" class="swatch red" data-symbol="🟥" aria-label="Add a red tile"></button>
          <button type="button" class="swatch orange" data-symbol="🟧" aria-label="Add an orange tile"></button>
          <button type="button" class="swatch yellow" data-symbol="🟨" aria-label="Add a yellow tile"></button>
          <button type="button" class="swatch green" data-symbol="🟩" aria-label="Add a green tile"></button>
          <button type="button" class="swatch blue" data-symbol="🟦" aria-label="Add a blue tile"></button>
          <button type="button" class="swatch violet" data-symbol="🟪" aria-label="Add a violet tile"></button>
          <button type="button" class="swatch white" data-symbol="⬜" aria-label="Add a white tile"></button>
        </div>
        <button type="submit" id="send" class="send-button" aria-keyshortcuts="Meta+Enter" title="Send to the board (⌘Enter)" disabled><span id="send-label">Send to the board</span><span class="send-shortcut" aria-hidden="true">⌘↵</span></button>
      </div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <button type="button" id="reconnect" class="text-button" hidden>Retry connection ↻</button>
    </form>
    <noscript><p>Enable JavaScript to preview and send a message.</p></noscript>
  </main>
</body>
</html>
