<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#151614" />
  <title>Vestaboard — Penta Projects</title>
  <meta name="description" content="Send a note or set a Pomodoro timer on John's Vestaboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/vestaboard-hub.css?v=2" />
  <script type="module" src="/assets/js/vestaboard-hub.js?v=1"></script>
</head>
<body>
  <header class="site-head">
    <a class="back-link" href="/tools/"><span aria-hidden="true">&larr;</span> All tools</a>
    <a class="site-name" href="/">Penta Projects <span aria-hidden="true">&nearr;</span></a>
  </header>

  <main>
    <div class="page-heading">
      <h1>Vestaboard<span class="title-dot">.</span></h1>
      <div class="tile-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <ul class="app-list" aria-label="Vestaboard apps">
      <li class="note-app">
        <a class="app-card" href="/tools/vestaboard.html" aria-labelledby="note-title">
          <div class="app-art" aria-hidden="true">
            <span class="app-number"></span>
            <div class="mini-note">
              <div class="app-board" data-preview="HEY, YOU.&#10;HAVE A GOOD DAY&#10;🟨🟨🟨"></div>
              <span class="device-name">Vestaboard</span>
            </div>
          </div>
          <div class="app-info">
            <h2 id="note-title">Send a note</h2>
            <span class="app-arrow" aria-hidden="true">&nearr;</span>
          </div>
        </a>
      </li>
      <li class="timer-app">
        <a class="app-card" href="/tools/pomodoro.html" aria-labelledby="timer-title">
          <div class="app-art" aria-hidden="true">
            <span class="app-number"></span>
            <div class="mini-note">
              <div class="app-board" data-preview="ONE THING&#10;FOCUS 25 MIN&#10;🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪🟪"></div>
              <span class="device-name">Vestaboard</span>
            </div>
          </div>
          <div class="app-info">
            <h2 id="timer-title">Pomodoro timer</h2>
            <span class="app-arrow" aria-hidden="true">&nearr;</span>
          </div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
