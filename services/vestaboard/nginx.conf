# Include inside the existing jpentakalos.com server block.
# The shared limit uses one key for this single physical board, independent of IP.
location ^~ /api/vestaboard/ {
    include /etc/nginx/snippets/vestaboard-cloudflare-real-ip.conf;
    client_max_body_size 4k;
    limit_req zone=vestaboard_requests burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @vestaboard_busy;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
    proxy_next_upstream off;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# The Sports page replaced the NFL-only page; keep old links and bookmarks working.
location = /tools/nfl.html {
    absolute_redirect off;
    return 301 /tools/sports.html$is_args$args;
}

location @vestaboard_busy {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 15 always;
    return 429 '{"error":"The board is busy. Try again in a moment.","retryAfter":15}';
}
