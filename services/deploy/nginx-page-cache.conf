# Installed at /etc/nginx/conf.d/page-cache.conf by scripts/install-deploy-hook.sh.
# HTML pages must be revalidated on every load: they are the only unversioned
# entry point to the content-hashed CSS/JS, and a stale page can link to assets
# a deploy removed. Locations that set their own add_header do not inherit this.
map $sent_http_content_type $page_cache_control {
    ~^text/html no-cache;
    default     "";
}
add_header Cache-Control $page_cache_control;
